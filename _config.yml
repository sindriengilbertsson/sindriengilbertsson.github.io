locale: "en-US"
title: "Sindri Engilbertsson"
title_separator: "-"
name: "Sindri Engilbertsson"
description: "PhD candidate in Economics at the University of Amsterdam. Industrial organisation and competition policy."
url: "https://sindriengilbertsson.github.io"
baseurl: ""
repository: "sindriengilbertsson/sindriengilbertsson.github.io"
timezone: Europe/Amsterdam
og_image: "/images/SindriEngilbertsson.jpg"

author:
  name: "Sindri Engilbertsson"
  avatar: "SindriEngilbertsson.jpg"
  bio: "PhD candidate in Economics · University of Amsterdam"
  focus: "Industrial organisation and competition policy."
  email: "s.engilbertsson@uva.nl"

analytics:
  provider: false
comments:
  provider: false
breadcrumbs: false
future: true

include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - package.json
  - node_modules
  - vendor
  - scripts
  - tests
  - preview
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor

encoding: "utf-8"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: "files/Industrial_Organization.pdf"
    values:
      sitemap: false

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
