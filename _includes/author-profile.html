<div itemscope itemtype="https://schema.org/Person">
  <div class="author__avatar">
    <img src="{{ site.author.avatar | prepend: '/images/' | relative_url }}" alt="{{ site.author.name }}" itemprop="image">
  </div>
  <div class="author__content">
    <h2 class="author__name" itemprop="name">{{ site.author.name }}</h2>
    <p class="author__bio">{{ site.author.bio }}</p>
    <p class="author__focus">{{ site.author.focus }}</p>
    <p class="author__contact"><a href="mailto:{{ site.author.email }}" itemprop="email">{{ site.author.email }}</a></p>
  </div>
</div>
