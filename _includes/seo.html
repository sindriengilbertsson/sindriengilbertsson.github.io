{% assign seo_title = site.title %}
{% if page.title and page.url != '/' %}{% assign seo_title = page.title | append: ' - ' | append: site.title %}{% endif %}
{% assign seo_description = page.description | default: site.description %}
<title>{{ seo_title | escape }}</title>
<meta name="description" content="{{ seo_description | escape }}">
<meta name="google-site-verification" content="FugEQcV9Xu40c6ZpcYe5F52aMPBHdm4FyvMKR6rwIWY" />
{% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{ site.locale | replace: '-', '_' }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ seo_title | escape }}">
<meta property="og:description" content="{{ seo_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.og_image | absolute_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.name | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "image": {{ site.og_image | absolute_url | jsonify }},
  "jobTitle": "PhD candidate in Economics",
  "affiliation": {"@type": "CollegeOrUniversity", "name": "University of Amsterdam"}
}
</script>
